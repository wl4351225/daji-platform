<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按钮交互测试</title>
<style>
.btn {
  display: inline-block;
  padding: 8px 20px;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  margin: 10px;
}
.btn-primary {
  background: #e60012;
  color: #fff;
}
.btn-outline {
  background: #fff;
  color: #e60012;
  border: 1px solid #e60012;
}
.btn-success {
  background: #52c41a !important;
  color: #fff !important;
  border-color: #52c41a !important;
}
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.loading {
  display: inline-block;
  animation: pulse 1.5s infinite;
}
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(0, 0, 0, 0.8);
  color: #fff;
  padding: 12px 24px;
  border-radius: 4px;
  font-size: 14px;
  z-index: 1000;
  transition: transform 0.3s ease;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}
@keyframes pulse {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
</style>
</head>
<body>
<h1>按钮交互功能测试</h1>
<p>点击以下按钮测试交互功能：</p>

<h2>发布需求按钮</h2>
<button class="btn btn-primary btn-publish">立即发布</button>
<button class="btn btn-outline">保存草稿</button>

<h2>比价按钮</h2>
<button class="btn btn-outline btn-compare">加入比价</button>

<h2>供应商按钮</h2>
<button class="btn btn-primary btn-quote">立即报价</button>

<h2>运营按钮</h2>
<button class="btn btn-primary btn-intervene">人工推荐</button>

<script>
// 按钮交互处理
function handleButtonClick(button, action) {
  button.disabled = true;
  button.innerHTML = '<span class="loading">处理中...</span>';
  
  setTimeout(() => {
    button.disabled = false;
    button.textContent = action === 'submit' ? '已提交' : '已处理';
    button.classList.add('btn-success');
    
    // 显示成功提示
    showToast(`${action === 'submit' ? '提交' : '操作'}成功！`);
  }, 1000);
}

// 显示提示
function showToast(message) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

// 绑定按钮事件
function bindButtonEvents() {
  // 发布需求按钮
  document.querySelectorAll('.btn-publish').forEach(btn => {
    btn.addEventListener('click', function() {
      handleButtonClick(this, 'submit');
    });
  });
  
  // 查看比价按钮
  document.querySelectorAll('.btn-compare').forEach(btn => {
    btn.addEventListener('click', function() {
      handleButtonClick(this, 'compare');
    });
  });
  
  // 供应商端按钮
  document.querySelectorAll('.btn-quote').forEach(btn => {
    btn.addEventListener('click', function() {
      handleButtonClick(this, 'quote');
    });
  });
  
  // 运营端按钮
  document.querySelectorAll('.btn-intervene').forEach(btn => {
    btn.addEventListener('click', function() {
      handleButtonClick(this, 'intervene');
    });
  });
  
  // 所有按钮的通用处理
  document.querySelectorAll('.btn:not(.btn-publish):not(.btn-compare):not(.btn-quote):not(.btn-intervene)').forEach(btn => {
    btn.addEventListener('click', function() {
      handleButtonClick(this, 'action');
    });
  });
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
  bindButtonEvents();
});
</script>
</body>
</html>
